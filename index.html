<script>
const PEER_OPTS={}; // default = free PeerJS cloud signaling. Self-hosted: {host:'your.server',port:9000,path:'/'}
const $=i=>document.getElementById(i),COLORS=['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#f48fb1','#ff8f00','#00acc1','#6d4c41','#cfd8dc'];
const ROOMS=[[400,60,400,240,'Cafeteria'],[60,380,260,260,'Storage'],[880,380,260,260,'Reactor'],[470,520,260,220,'Electrical'],[160,230,60,150],[160,230,240,60],[980,230,60,150],[800,230,240,60],[570,300,60,220],[60,60,260,160,'Medbay'],[320,100,80,60],[1240,380,200,260,'Navigation'],[1140,480,100,60],[60,860,260,200,'Lab'],[470,880,260,180,'Admin'],[1180,860,260,200,'Shields'],[160,640,60,220],[1320,640,60,220],[570,740,60,140],[320,960,150,60],[730,960,450,60],[1240,60,260,200,'Comms'],[1320,260,60,120],[1500,130,120,60],[1620,60,320,240,'Greenhouse'],[1760,300,60,120],[1620,420,320,220,'Armory'],[1440,480,180,60],[1760,640,60,220],[1620,860,320,200,'Library'],[1440,940,180,60]];const W=2000,HT=1100;
const TASKS=[[480,120],[720,120],[120,440],[260,590],[940,440],[1080,590],[520,690],[680,690],[180,140],[1340,500],[150,940],[520,950],[680,1010],[1260,920],[1380,1000],[1300,120],[1700,160],[1860,230],[1700,540],[1860,580],[1780,960]],GAME=['wires','swipe','fuel','simon','code','wires','aim','code','aim','simon','simon','wires','swipe','fuel','code','aim','wires','simon','swipe','fuel','code'],BTN=[600,180],FIX=[600,690],VENTS=[[100,420],[500,700],[1100,420],[1400,420],[520,1030],[1400,1020],[1280,210],[1900,100],[1900,470]];
const TN=['Cafeteria: fix wires','Cafeteria: swipe card','Storage: fuel the engine','Storage: memory sequence','Reactor: enter code','Reactor: fix wires','Electrical: calibrate','Electrical: enter code','Medbay: calibrate scanner','Navigation: chart the course','Lab: memory sequence','Admin: fix wires','Admin: swipe card','Shields: fuel the engine','Shields: enter code','Comms: calibrate','Greenhouse: fix wires','Greenhouse: memory sequence','Armory: swipe card','Armory: fuel the engine','Library: enter code'];
const FL={Cafeteria:'#f4d9a6',Storage:'#e0c9a6',Reactor:'#f2b8b0',Electrical:'#f6e8a0',Medbay:'#b9e6e0',Navigation:'#bccaf4',Lab:'#cde8b8',Admin:'#e3c8f0',Shields:'#b8e0f4',Comms:'#b8d8f0',Greenhouse:'#c5e8b0',Armory:'#d6c8c0',Library:'#e8d4b8'};
const DOORS={Storage:[[160,372,60,16],[160,632,60,16]],Reactor:[[980,372,60,16],[1132,480,16,60]],Electrical:[[570,512,60,16],[570,732,60,16]],Medbay:[[312,100,16,60]],Navigation:[[1232,480,16,60],[1320,632,60,16],[1432,480,16,60],[1320,372,60,16]],Cafeteria:[[392,230,16,60],[392,100,16,60],[792,230,16,60],[570,292,60,16]],Lab:[[160,852,60,16],[312,960,16,60]],Admin:[[570,872,60,16],[462,960,16,60],[722,960,16,60]],Shields:[[1320,852,60,16],[1172,960,16,60],[1432,940,16,60]],Comms:[[1320,252,60,16],[1492,130,16,60]],Greenhouse:[[1612,130,16,60],[1760,292,60,16]],Armory:[[1612,480,16,60],[1760,412,60,16],[1760,632,60,16]],Library:[[1612,940,16,60],[1760,852,60,16]]};
const PROPS=[['t',500,190],['t',700,190],['c',280,430],['c',110,610],['r',1010,510],['p',500,545],['p',580,545],['p',660,545],['b',120,100],['b',120,170],['n',1340,420],['c',270,940],['b',120,1020],['p',520,905],['p',600,905],['p',680,905],['t',620,1020],['n',1300,885],['r',1310,1010],['g',1680,110],['g',1780,260],['g',1900,120],['g',1660,250],['n',1400,90],['p',1290,90],['c',1700,600],['c',1880,450],['c',1900,620],['t',1700,1010],['t',1880,930]];
const ok=(x,y)=>[[0,0],[12,0],[-12,0],[0,12],[0,-12]].every(([a,b])=>ROOMS.some(r=>x+a>=r[0]&&x+a<=r[0]+r[2]&&y+b>=r[1]&&y+b<=r[1]+r[3]));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let peer,conns=[],hostConn,isHost=false,myId,myName,H={},role='crew',imps=[],myTasks=[],done=new Set(),cdEnd=0,me={x:600,y:150};
let S={ph:'menu',pl:{},bodies:[],td:0,tt:1,chat:[],voted:{}};

// ---------- networking ----------
// Two transports: PeerJS (WebRTC) or "Relay" (MQTT public brokers, tried in order). Relay room codes are 5 characters.
const BROKERS=['wss://mqtt.eclipseprojects.io:443/mqtt','wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let MQW,hostCode;const LB='crewgame/v1/lobby/';let mq=null,base='',seen={},full={},pc=0,pi;
const genCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
const pub=(t,m)=>mq&&mq.connected&&mq.publish(base+t,JSON.stringify(m));
const bc=m=>mq?pub('/s',m):conns.forEach(c=>c.open&&c.send(m));
const send=(id,m)=>{if(id==myId)onMsg(m);else if(mq)pub('/p/'+id,m);else{const c=conns.find(c=>c.peer==id);c&&c.open&&c.send(m)}};
const tx=m=>isHost?handle(myId,m):mq?pub('/h',{f:myId,m}):hostConn&&hostConn.open&&hostConn.send(m);
const setName=()=>myName=($('name').value||'Player').slice(0,12);
const NOROOM='Room not found. Check the code, and make sure the host is already on the lobby screen.';
function init(id){if(peer)peer.destroy();setName();peer=new Peer(id,PEER_OPTS);
 peer.on('error',e=>$('msg').textContent=e.type=='peer-unavailable'?NOROOM:/server-error|network|socket/.test(e.type)?'Cannot reach the PeerJS server. Host with "Relay" instead, or try another network.':'Error: '+e.type+' (try again)');
 peer.on('disconnected',()=>peer.reconnect())}
function hostPeer(){const code=genCode();init('crewgame-'+code);
 peer.on('open',id=>{isHost=true;myId=id;S={ph:'lobby',pl:{},bodies:[],td:0,tt:1,chat:[],voted:{}};addP(id,myName,myCol,eh());$('code').textContent=code;setInterval(tick,66)});
 peer.on('connection',c=>{conns.push(c);c.on('data',m=>{if(m.t=='join'){if(S.ph!='lobby'||Object.keys(S.pl).length>=10)return c.send({t:'full'});addP(c.peer,String(m.n||'Player'),m.c,m.h)}else handle(c.peer,m)});c.on('close',()=>drop(c.peer))})}
function joinPeer(){init();peer.on('open',id=>{myId=id;hostConn=peer.connect('crewgame-'+$('code2').value.trim().toUpperCase(),{serialization:'json'});
 hostConn.on('open',()=>hostConn.send({t:'join',n:myName,c:myCol,h:eh()}));hostConn.on('data',onMsg);hostConn.on('close',()=>{if(S.ph!='menu'){alert('Disconnected from host');location.reload()}})})}
function mqConnect(subs,onT,ready,i=0){
 if(i>=BROKERS.length)return $('msg').textContent='No relay broker reachable. Try another network.';
 $('msg').textContent='Connecting...';let ok=0,nx=0;
 const c=mqtt.connect(BROKERS[i],{connectTimeout:5000,reconnectPeriod:0,keepalive:15,will:MQW,clientId:'cg'+Math.random().toString(16).slice(2,10)});
 c.on('connect',()=>{if(ok)return;ok=1;mq=c;c.options.reconnectPeriod=2000;$('msg').textContent='';c.subscribe(subs,()=>ready())});
 c.on('message',(t,p)=>{try{onT(t,JSON.parse(p))}catch(e){}});
 c.on('error',()=>{});
 c.on('close',()=>{if(!ok&&!nx++){c.end(true);mqConnect(subs,onT,ready,i+1)}})}
function hostMq(){setName();const code=genCode()+'M',pubr=$('pubc').checked;hostCode=code;MQW=pubr?{topic:LB+code,payload:'',retain:true,qos:0}:undefined;base='crewgame/v1/'+code;myId='host';
 mqConnect([base+'/h'],(t,m)=>{const f=m.f,x=m.m;if(!f||!x)return;seen[f]=Date.now();
  if(x.t=='ping'){if(!S.pl[f]){if(S.ph!='lobby'||Object.keys(S.pl).length>=10){if(!full[f]){full[f]=1;send(f,{t:'full'})}}else addP(f,String(x.n||'Player'),x.c,x.h)}}else handle(f,x)},
  ()=>{isHost=true;S={ph:'lobby',pub:pubr?1:0,pl:{},bodies:[],td:0,tt:1,chat:[],voted:{}};addP(myId,myName,myCol,eh());$('code').textContent=code;setInterval(tick,100)})}
function joinMq(){setName();const code=$('code2').value.trim().toUpperCase();base='crewgame/v1/'+code;myId='c'+Math.random().toString(36).slice(2,8);let got=0;
 mqConnect([base+'/s',base+'/p/'+myId],(t,m)=>{got=1;onMsg(m)},()=>{const ping=()=>pub('/h',{f:myId,m:{t:'ping',n:myName,c:myCol,h:eh()}});ping();pi=setInterval(ping,2000);
  setTimeout(()=>{if(!got){clearInterval(pi);$('msg').textContent=NOROOM;mq.end(true);mq=null}},6000)})}
$('host').onclick=()=>($('net').value=='mqtt'||$('pubc').checked)?hostMq():hostPeer();
$('join').onclick=()=>$('code2').value.trim().length>4?joinMq():joinPeer();
function addP(id,n,c0,h){const u=Object.values(S.pl).map(p=>p.c);let c=(c0>=0&&c0<COLORS.length&&!u.includes(c0))?c0|0:-1;if(c<0){c=0;while(u.includes(c))c++}S.pl[id]={n:S.pub?CN[c]:n.slice(0,12),c,h:(h>=0&&h<7)?h|0:0,x:600,y:150,a:1}}
function drop(id){conns=conns.filter(c=>c.peer!=id);delete S.pl[id];if(S.ph=='play'||S.ph=='meet')check()}
function onMsg(m){if(m.t=='s')S=m.s;else if(m.t=='role'){role=m.r;myTasks=m.tk;imps=m.imps;done=new Set();const r=$('rv');r.textContent=m.r=='imp'?'IMPOSTOR':'CREWMATE';r.style.cssText='z-index:7;pointer-events:none;font:800 64px Impact,sans-serif;color:'+(m.r=='imp'?'#ff5252':'#4fc3f7');r.classList.remove('h');setTimeout(()=>r.classList.add('h'),2600)}else if(m.t=='dn')done.add(m.i);
 else if(m.t=='tp'){me.x=m.x;me.y=m.y}else if(m.t=='cd')cdEnd=Date.now()+m.ms;else if(m.t=='sabcd')sabEnd=Date.now()+m.ms;else if(m.t=='dcd')doorEnd=Date.now()+m.ms;else if(m.t=='full'){alert('Room full or game already started');location.reload()}}

// ---------- host logic (host is the referee) ----------
function tp(){Object.keys(S.pl).forEach((id,i)=>{const p=S.pl[id];p.x=480+(i%8)*35;p.y=130+Math.floor(i/8)*40;send(id,{t:'tp',x:p.x,y:p.y})})}
function start(){const ids=Object.keys(S.pl).sort(()=>Math.random()-.5),ni=ids.length>=7?2:1;
 H={roles:{},tasks:{},done:{},votes:{},kcd:{},used:{}};const LVL={short:1,medium:2,long:3}[($('len')||{}).value||'long'];S.lv=LVL;H.nt=[0,5,8,10][LVL];H.kms=[0,20000,25000,30000][LVL];H.ml=[0,45000,60000,75000][LVL];S.tt=0;S.td=0;S.bodies=[];S.win=null;S.rl=null;
 ids.forEach((id,i)=>{const imp=i<ni;H.roles[id]=imp?'imp':'crew';H.done[id]=new Set();S.pl[id].a=1;
  H.tasks[id]=[...TASKS.keys()].sort(()=>Math.random()-.5).slice(0,H.nt);if(!imp)S.tt+=H.nt;
  send(id,{t:'role',r:imp?'imp':'crew',tk:H.tasks[id],imps:imp?ids.slice(0,ni):[]});if(imp){H.kcd[id]=Date.now()+10000;send(id,{t:'cd',ms:10000})}});
 S.lt=0;S.dr={};S.ph='play';tp()}
function check(){const al=Object.keys(S.pl).filter(k=>S.pl[k].a),im=al.filter(k=>H.roles[k]=='imp').length;
 if(!im)return endGame('Crew');if(im>=al.length-im)return endGame('Impostors');return false}
function endGame(w){S.ph='end';S.win=w;S.rl=H.roles;return true}
function startMeeting(mi,mn){S.em={};S.mi=mi;S.mn=mn;S.lt=0;S.dr={};S.ph='meet';S.bodies=[];S.chat=[];S.voted={};H.votes={};H.mend=Date.now()+(H.ml||40000);S.tm=(H.ml||40000)/1000;S.res=''}
function tally(){const c={};Object.values(H.votes).forEach(v=>c[v]=(c[v]||0)+1);let top=null,mx=0,tie=false;
 for(const k in c){if(k=='skip')continue;if(c[k]>mx){mx=c[k];top=k;tie=false}else if(c[k]==mx)tie=true}
 if(top&&!tie&&mx>(c.skip||0)&&S.pl[top]){S.pl[top].a=0;S.ej={n:S.pl[top].n,c:S.pl[top].c,h:S.pl[top].h};S.res=S.pl[top].n+(H.roles[top]=='imp'?' was an Impostor.':' was not an Impostor.')}else{S.ej=null;S.res='No one was ejected.'}
 S.vt={...H.votes};S.ph='reveal';H.rvend=Date.now()+5000}
function handle(id,m){const p=S.pl[id];if(!p)return;
 if(m.t=='p'){if(S.ph=='play'&&ok(m.x,m.y)){p.x=m.x;p.y=m.y}return}
 if(m.t=='task'){const t=TASKS[m.i];if(S.ph=='play'&&H.roles[id]=='crew'&&H.tasks[id].includes(m.i)&&!H.done[id].has(m.i)&&dist(p,{x:t[0],y:t[1]})<60){H.done[id].add(m.i);S.td++;send(id,{t:'dn',i:m.i});if(S.td>=S.tt)endGame('Crew')}return}
 if(m.t=='kill'){if(S.ph!='play'||!p.a||H.roles[id]!='imp'||Date.now()<(H.kcd[id]||0))return;
  const v=Object.entries(S.pl).filter(([k,q])=>q.a&&H.roles[k]=='crew'&&dist(p,q)<70).sort((a,b)=>dist(p,a[1])-dist(p,b[1]))[0];
  if(v){const q=v[1];q.a=0;S.bodies.push({x:q.x,y:q.y,c:COLORS[q.c]});p.x=q.x;p.y=q.y;send(id,{t:'tp',x:q.x,y:q.y});H.kcd[id]=Date.now()+H.kms;send(id,{t:'cd',ms:H.kms});check()}return}
